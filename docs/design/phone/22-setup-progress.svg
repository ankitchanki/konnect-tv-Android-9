 fill="#8A8D99">Adding your apps</text><rect x="18" y="724" width="354" height="76" rx="12" fill="#1F1F26" /><text x="30" y="746" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#8A8D99">The TV can look frozen for up to 2 minutes while it switches</text><text x="30" y="763.04" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#8A8D99">home screens. That&#x27;s normal. Leave it on and don&#x27;t unplug</text><text x="30" y="780.08" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#8A8D99">it.</text><text x="28" y="25" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#ECEEF4" font-weight="600">9:41</text><path transform="translate(300 12) scale(0.625)" d="M4 20h2v-3H4zM9 20h2v-7H9zM14 20h2V9h-2zM19 20h2V4h-2z" fill="#ECEEF4"/><path transform="translate(320 11) scale(0.666667)" d="M3 9a13 13 0 0 1 18 0M6 12.5a8.5 8.5 0 0 1 12 0M9 16a4 4 0 0 1 6 0M12 19.5h.01" fill="none" stroke="#ECEEF4" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="342" y="15" width="20" height="10" rx="3" fill="none" stroke="#ECEEF4" stroke-width="1.2" /><rect x="344" y="17" width="13" height="6" rx="1.5" fill="#ECEEF4" /><rect x="141" y="834" width="108" height="4" rx="2" fill="#ECEEF4" opacity="0.5" /></g><rect x="0.5" y="0.5" width="389" height="843" rx="36" fill="none" stroke="#2A2A33" stroke-width="1" /></svg>
