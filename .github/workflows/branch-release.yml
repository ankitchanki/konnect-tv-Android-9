name: Branch release APK

# Builds installable APKs from this branch only, separate from main.
# Signing uses repository secrets, so the key never lives in the repo:
#   KEYSTORE_BASE64   the release keystore, base64-encoded
#   KEYSTORE_PASSWORD the keystore password
#   KEY_ALIAS         the key alias
#   KEY_PASSWORD      the key password
# Without them the release APK is unsigned and a debug APK is attached for testing.

on:
  push:
    branches: [claude/kind-pasteur-89aufo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret: building unsigned release plus a debug APK." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:assembleDebug
      - name: Verify release signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)" verify --print-certs "$apk" | grep -i "certificate SHA-256" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: KonnectTVPlus-${{ steps.signing.outputs.signed == 'true' && 'signed-release' || 'unsigned' }}-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
