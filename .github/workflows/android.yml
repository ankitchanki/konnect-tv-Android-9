name: Android 9+ compatibility

on:
  push:
    branches: [main, android-9-compat]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build installable test APKs
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :glowlauncher:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: KonnectTV-Android9-test-build
          path: |
            app/build/outputs/apk/debug/*.apk
            glowlauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error

  android-smoke:
    name: Android API ${{ matrix.api }} smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            target: default
          - api: 36
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: Nexus 6
          disable-animations: true
          script: bash tools/run-emulator-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-API-${{ matrix.api }}-smoke-results
          path: |
            app/build/reports/androidTests/connected/
            ui-previews/
